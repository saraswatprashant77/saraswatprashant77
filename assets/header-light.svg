<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Prashant Saraswat — Salesforce developer building intelligent CRM">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(21,21,19,0.13)"/></pattern>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#e03a0a" stop-opacity="0.22"/><stop offset="1" stop-color="#e03a0a" stop-opacity="0"/></radialGradient>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
      .pulse{animation:pulse 1.8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .blink{animation:blink 1s step-end infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#f3f1eb"/>
  <rect width="1200" height="340" rx="24" fill="url(#dots)"/>
  <rect width="1200" height="340" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#dad6cc"/>

  <g>
    <circle cx="68" cy="62" r="22" fill="#151513"/>
    <text x="68" y="69" text-anchor="middle" class="serif" font-size="19" fill="#f3f1eb">PS</text>
    <circle cx="84" cy="46" r="5" fill="#e03a0a" stroke="#f3f1eb" stroke-width="2"/>
    <text x="104" y="58" class="sans" font-size="17" font-weight="600" fill="#151513">Prashant Saraswat</text>
    <text x="104" y="79" class="mono" font-size="12" letter-spacing="1.6" fill="#6c6860">SALESFORCE DEVELOPER</text>
  </g>
  <g>
    <circle cx="858" cy="58" r="5" fill="#10b981" class="pulse"/>
    <text x="872" y="63" class="sans" font-size="14" fill="#151513">Open to Salesforce roles &amp; freelance</text>
  </g>
  <line x1="46" y1="108" x2="1154" y2="108" stroke="#dad6cc"/>

  <text x="44" y="190" class="sans" font-size="66" font-weight="600" letter-spacing="-2.5" fill="#151513">Salesforce developer building</text>
  <text x="44" y="266" font-size="66" letter-spacing="-2.5" fill="#151513"><tspan class="serif" fill="#e03a0a" letter-spacing="0">intelligent</tspan><tspan class="sans" font-weight="600"> CRM.</tspan></text>
  <rect x="540" y="222"  width="4" height="48" fill="#e03a0a" class="blink"/>

  <text x="46" y="310" class="mono" font-size="13" letter-spacing="1.4" fill="#6c6860">APEX  /  LWC  /  AGENTFORCE  /  INTEGRATIONS  /  REACT</text>
  <g>
    <line x1="930" y1="146" x2="930" y2="284" stroke="#dad6cc"/>
    <text x="958" y="170" class="sans" font-size="30" font-weight="600" letter-spacing="-1" fill="#151513">4<tspan fill="#e03a0a">×</tspan></text>
    <text x="1004" y="168" class="mono" font-size="11" letter-spacing="1.2" fill="#6c6860">SALESFORCE CERTIFIED</text>
    <text x="958" y="224" class="sans" font-size="30" font-weight="600" letter-spacing="-1" fill="#151513">104K<tspan fill="#e03a0a">+</tspan></text>
    <text x="1050" y="222" class="mono" font-size="11" letter-spacing="1.2" fill="#6c6860">TRAILHEAD POINTS</text>
    <text x="958" y="278" class="sans" font-size="30" font-weight="600" letter-spacing="-1" fill="#151513">2</text>
    <text x="982" y="276" class="mono" font-size="11" letter-spacing="1.2" fill="#6c6860">AI AGENTS BUILT</text>
  </g>
</svg>
